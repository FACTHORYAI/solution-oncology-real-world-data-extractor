[project]
name = "oncology_real_world_data_extractor"
version = "0.1.0"
description = "Turn oncology notes into structured real-world data: diagnoses, staging, treatments and outcomes as tables in Facthory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=17",
]

[project.scripts]
oncology_real_world_data_extractor = "oncology_real_world_data_extractor.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncology_real_world_data_extractor"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"data/generate_sample.py" = ["E501"]
